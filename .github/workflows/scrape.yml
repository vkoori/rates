name: Scrape Bonbast rates

on:
  schedule:
    - cron: '30 * * * *'  # every hour, at 30
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-bonbast-rates
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run scraper in base image
        run: |
          docker run --rm \
            -v "$PWD:/app" -w /app \
            ghcr.io/vkoori/php_node:24.18.0-bookworm-slim \
            sh -c "npm ci && npm run scrape"

      - name: Commit rates.json if it changed
        run: |
          if [ -z "$(git status --porcelain -- rates.json)" ]; then
            echo "No changes to rates.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git commit -m "chore: update rates.json [skip ci]"
          git push
